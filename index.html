<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3DPRINTECH</title>
<meta name="theme-color" content="#13223D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3DPRINTECH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F1F3F6;--surface:#fff;--surface-2:#F5F7FA;--ink:#172235;--muted:#5B6779;--line:#DCE2E9;
  --navy:#13223D;--accent:#2F68B0;--accent-ink:#fff;--accent-soft:#E3ECF7;
  --orange:#E2973B;--orange-ink:#8A520D;--orange-soft:#FBEBD6;
  --ok:#2C7A4E;--ok-soft:#E0F0E6;--warn:#946210;--warn-soft:#F6ECD3;--bad:#B03A2E;--bad-soft:#F6E0DC;
  --b-mat:#2F68B0;--b-luz:#D6A032;--b-des:#6B8794;--b-fon:#E08C2C;--b-mi:#2E8A57;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1420;--surface:#172030;--surface-2:#1D2839;--ink:#E7ECF3;--muted:#9DAABD;--line:#2C394D;
  --accent:#6FA3E6;--accent-ink:#0B1422;--accent-soft:#1E3150;--orange:#EFA24E;--orange-ink:#F5C38A;--orange-soft:#3A2C1A;
  --ok:#6CC08F;--ok-soft:#1C3326;--warn:#E0AE4C;--warn-soft:#3A3020;--bad:#EB8174;--bad-soft:#3F2522;
  --b-mat:#6FA3E6;--b-luz:#E6B64F;--b-des:#8FA9B5;--b-fon:#EFA24E;--b-mi:#5DBE86;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:.86rem}.neg{color:var(--bad)}.pos{color:var(--ok)}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 10px) 16px 12px;display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;border-radius:10px;background:#fff;padding:2px}
.top .t{flex:1;min-width:0}
.top b{display:block;font-size:1.06rem;font-weight:800;letter-spacing:.02em}
.top .sync{font-size:.78rem;color:#B9C5D6;display:flex;align-items:center;gap:6px}
.top .sync i{width:8px;height:8px;border-radius:50%;background:#8EA0B8;display:inline-block}
.top .sync.ok i{background:#5DBE86}.top .sync.busy i{background:#E6B64F}.top .sync.off i{background:#EB8174}
.top button.icon{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}

/* Contenido */
main{padding:16px 16px calc(96px + var(--safe-b));max-width:860px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
.page-h h1{font-size:1.6rem;font-weight:800}
.page-h p{color:var(--muted);font-size:.92rem;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mid{font-size:1.4rem;font-weight:800}
.lbl{font-size:.85rem;color:var(--muted)}

/* Botones */
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:13px 18px;min-height:48px;cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.orange{background:var(--orange);color:#1d1203}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:650;padding:6px 0;cursor:pointer}

/* Inicio: botones grandes */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:20px;padding:18px 16px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#fff;font-weight:800;font-size:1.15rem}
.tile svg{width:34px;height:34px}
.tile span{font-weight:500;font-size:.85rem;opacity:.9}
.t-venta{background:#2E8A57}.t-dent{background:#2F68B0}.t-rollo{background:#E2973B;color:#1d1203}.t-cot{background:#13223D}
@media (prefers-color-scheme:dark){.t-cot{background:#2A3E62}}
.alert{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink)}
.alert.info{background:var(--accent-soft)}.alert.bad{background:var(--bad-soft)}.alert.good{background:var(--ok-soft)}
.alert b{display:block}.alert p{font-size:.88rem;color:var(--muted)}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:1rem;min-height:48px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.money{font-size:1.6rem;font-weight:800;padding:10px 13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:650;color:var(--muted);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px 7px 8px;font-weight:650;font-size:.92rem;cursor:pointer;white-space:nowrap;min-height:44px}
.chip.plain{padding:7px 14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip small{color:var(--muted);font-weight:500}
.sw{display:inline-block;width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:1.8rem;font-weight:700;cursor:pointer}
.stepper output{font-size:2.6rem;font-weight:800;min-width:70px;text-align:center}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:650;list-style:none}
details.more summary::-webkit-details-marker{display:none}

/* Barras de reparto */
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.c-mat{background:var(--b-mat)}.c-luz{background:var(--b-luz)}.c-des{background:var(--b-des)}.c-fon{background:var(--b-fon)}.c-mi{background:var(--b-mi)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:.88rem}
.legend div{display:flex;align-items:center;gap:7px}
.legend b{margin-left:auto;font-weight:700}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt span{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:750;white-space:nowrap}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Rollos */
.spools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.spool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;color:inherit;font:inherit}
.spool .sw{width:58px;height:58px}
.spool b{font-weight:700}
.spool .g{font-size:1.25rem;font-weight:800}
.meter{width:100%;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.spool.low{border-color:var(--orange)}.spool.low .meter span{background:var(--orange)}
.spool.add{border-style:dashed;justify-content:center;color:var(--accent);font-weight:700;min-height:150px}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.colors button{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.colors button[aria-pressed="true"]{border-color:var(--accent)}
.paleta{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pc .sw{width:64px;height:64px}
.pc.no{opacity:.35}

/* Cotizar */
.prod{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.prod input,.prod select{background:var(--surface)}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.price-row .p{font-size:1.5rem;font-weight:800}
.total-bar{position:sticky;bottom:calc(76px + var(--safe-b));z-index:5;background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.total-bar .big{font-size:1.8rem}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.kv div:last-child{border-bottom:0}
.kv div span:first-child{color:var(--muted)}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:650;color:var(--muted);cursor:pointer;position:relative}
nav.tabs svg{width:25px;height:25px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--orange)}

/* Hoja inferior (formularios rápidos) */
dialog.sheet{border:0;padding:0;margin:0;position:fixed;inset:auto 0 0 0;width:100%;max-width:100%;max-height:94vh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);overflow:auto;padding-bottom:var(--safe-b)}
dialog.sheet::backdrop{background:rgba(8,14,24,.5)}
.sheet-in{padding:10px 16px 18px;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:1.3rem;font-weight:800}
.sheet-h button{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer;color:var(--ink)}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:650;font-size:.92rem;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Bienvenida */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(var(--safe-t) + 30px) 22px calc(var(--safe-b) + 30px);max-width:460px;margin:0 auto}
.welcome img{width:110px;height:110px;border-radius:24px;background:#fff;padding:6px;border:1px solid var(--line)}
.welcome h1{font-size:2rem;font-weight:800}

/* iPad y compu: menú lateral */
@media (min-width:900px){
  body{padding-left:230px}
  nav.tabs{top:0;right:auto;width:230px;bottom:0;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:calc(var(--safe-t) + 86px) 12px 12px;gap:4px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:12px 14px;border-radius:12px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  nav.tabs .dot{position:static;margin-left:auto}
  .top{position:fixed;left:0;top:0;width:230px;z-index:31}
  .top button.icon{display:none}
  main{padding:28px 32px 60px}
  .total-bar{bottom:16px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  dialog.sheet{inset:0;margin:auto;width:min(620px,92vw);max-height:88vh;border-radius:22px}
  .toast{top:20px;left:calc(50% + 115px)}
  .desk2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="welcome" class="welcome hidden">
  <img src="logo.png" alt="Logo de 3DPRINTECH">
  <h1>3DPRINTECH</h1>
  <p class="muted">Conecta tu Google Sheet para que tus datos se guarden y se vean igual en el cel, el iPad y la compu.</p>
  <label class="f">URL del Apps Script<input id="w-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>

<script src="jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
/* ================= Configuración ================= */
const DEFAULT_CFG={
  precioKg:300,merma:0.10,watts:120,kwh:4.64,impresora:12000,vida:5000,mant:1,
  margen:1.0,gmin:20,min:100,dis:100,post:50,pMi:0.70,
  dent:200,dentHoras:3,dentGramos:0,mayMin:10,mayPct:0.15,folioC:1,folioT:1,
  secadoDias:14,stockBajo:200,fondoInicial:315,
  negocio:"3DPRINTECH",tel:"3333929527",ig:"3dprintech__",pie:"Gracias por tu preferencia",
  avisoOn:1,avisoRedes:"A veces grabo el proceso de impresión para mis redes sociales. Antes de publicar fotos o videos de tu pieza, te pido permiso.",
  ultimoSecado:"",ultimoDentFid:"",hora1:35,hora2:40,horaLim:15
};
const COLS=["ventas","dentista","gastos","docs","filamentos","movs","pagos"];
const PRESETS=[["Negro","#1f1f1f"],["Blanco","#f4f4f2"],["Gris","#8a8f96"],["Plata","#c4c8cc"],["Rojo","#c62f2f"],["Naranja","#e8792b"],["Amarillo","#f2c230"],["Verde","#2e8b57"],["Azul","#2f5fb3"],["Morado","#7b4bb7"],["Rosa","#e48bb3"],["Café","#7a4e2d"],["Dorado","#c9a227"],["Transparente","#dfeef3"]];
const MATERIALES=["PLA","PLA Silk","PLA Mate","PETG","TPU","ABS"];
const CATS=["Material","Repuestos","Equipo","Envío","Empaque","Marketing","Otro"];
const SALE_DE={rep:"Reposición",fondo:"Fondo",mio:"Mi dinero"};
const defSaleDe=c=>(c==="Equipo"||c==="Repuestos")?"fondo":"rep";
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ================= Estado local ================= */
const LS={state:"3dp-state",out:"3dp-outbox",conn:"3dp-conn",pull:"3dp-lastpull",draft:"3dp-draft"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let state=load(LS.state,null)||{cfg:{...DEFAULT_CFG,_u:0}};
COLS.forEach(c=>{if(!Array.isArray(state[c]))state[c]=[]});
state.cfg={...DEFAULT_CFG,...state.cfg};
let outbox=load(LS.out,{}),conn=load(LS.conn,null),lastPull=load(LS.pull,0);
const C=()=>state.cfg;
const live=c=>state[c].filter(x=>!x._x);

/* ================= Utilidades ================= */
const $=id=>document.getElementById(id);
const MXN=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:2});
const money=x=>MXN.format(Math.round((Number(x)||0)*100)/100);
const money0=x=>"$"+Math.round(Number(x)||0).toLocaleString("es-MX");
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const r2=x=>Math.round((Number(x)||0)*100)/100;
const fmt=(x,d=0)=>(Math.round((Number(x)||0)*10**d)/10**d).toLocaleString("es-MX");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dshort=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${+d} ${MESES[+m-1]}`};
const dlong=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=k=>Math.round(n(C()[k])*1000)/10;
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2300)}

/* ================= Guardar y sincronizar ================= */
function clean(o){const d={...o};delete d._u;delete d._x;return d}
function save(col,item,msg){
  item._u=Date.now();
  const i=state[col].findIndex(x=>x.id===item.id);if(i>=0)state[col][i]=item;else state[col].push(item);
  outbox[col+":"+item.id]={c:col,id:item.id,u:item._u,x:item._x?1:0,d:clean(item)};
  commit(msg);
}
function remove(col,id,msg){const it=state[col].find(x=>x.id===id);if(!it)return;it._x=1;save(col,it,msg)}
function saveCfg(msg){C()._u=Date.now();outbox["cfg:cfg"]={c:"cfg",id:"cfg",u:C()._u,x:0,d:clean(C())};commit(msg)}
let syncT;
function commit(msg){store(LS.state,state);store(LS.out,outbox);render();if(msg)toast(msg);clearTimeout(syncT);syncT=setTimeout(syncNow,1200)}
function setSync(cls,text){const s=$("sync");s.className="sync "+cls;s.querySelector("span").textContent=text}
async function api(action,payload){
  if(!conn||!conn.url)throw new Error("sin-conexion");
  if(payload){const r=await fetch(conn.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...payload,action,key:conn.key})});return r.json()}
  const q=new URLSearchParams({action,key:conn.key,since:String(lastPull||0)});const r=await fetch(conn.url+"?"+q);return r.json();
}
let syncing=false;
async function syncNow(){
  if(!conn||!conn.url){setSync("off","Solo en este dispositivo");return}
  if(!navigator.onLine){setSync("off","Sin internet · se sube después");return}
  if(syncing)return;syncing=true;setSync("busy","Sincronizando…");
  try{
    const ops=Object.values(outbox);
    for(let i=0;i<ops.length;i+=150){
      const part=ops.slice(i,i+150),res=await api("push",{ops:part});
      if(!res.ok)throw new Error(res.error||"push");
      part.forEach(o=>{const k=o.c+":"+o.id;if(outbox[k]&&outbox[k].u===o.u)delete outbox[k]});
      store(LS.out,outbox);
    }
    const res=await api("pull");if(!res.ok)throw new Error(res.error||"pull");
    let changed=false;
    (res.records||[]).forEach(rec=>{
      const k=rec.c+":"+rec.id;if(outbox[k])return;
      if(rec.c==="cfg"){if(rec.u>(C()._u||0)){state.cfg={...DEFAULT_CFG,...rec.d,_u:rec.u};changed=true}return}
      if(!state[rec.c])return;
      const i=state[rec.c].findIndex(x=>x.id===rec.id),loc=i>=0?state[rec.c][i]:null;
      if(!loc||rec.u>(loc._u||0)){const it={...rec.d,id:rec.id,_u:rec.u};if(rec.x)it._x=1;if(i>=0)state[rec.c][i]=it;else state[rec.c].push(it);changed=true}
    });
    lastPull=Math.max(lastPull||0,(res.time||Date.now())-60000);store(LS.pull,lastPull);
    if(changed){store(LS.state,state);render(true)}
    setSync("ok",Object.keys(outbox).length?"Faltan cambios por subir":"Sincronizado");
  }catch(e){setSync("off",e.message==="clave"?"Clave incorrecta (Ajustes)":"No se pudo sincronizar")}
  finally{syncing=false}
}
window.addEventListener("online",syncNow);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()});
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},90000);

/* ================= Costo real y reparto ================= */
const cgDefault=()=>n(C().precioKg)/1000;
const fil=id=>state.filamentos.find(f=>f.id===id&&!f._x);
const cgOf=fid=>{const f=fil(fid);return f&&n(f.pesoNuevo)>0?n(f.costo)/n(f.pesoNuevo):cgDefault()};
const horaMaq=()=>(n(C().vida)>0?n(C().impresora)/n(C().vida):0)+n(C().mant);
const luzHora=()=>n(C().watts)/1000*n(C().kwh);
function costoPieza(it){
  const c=C(),cant=Math.max(1,Math.round(n(it.cant)||1)),h=n(it.horas),us=it.multi?(it.usos||[]).filter(u=>n(u.g)>0):null;
  const material=(us?us.reduce((t,u)=>t+n(u.g)*cgOf(u.fid),0):n(it.gramos)*cgOf(it.fid))*(1+n(c.merma)),luz=h*luzHora(),desgaste=h*horaMaq(),labor=n(it.postMin)/60*n(c.post)+n(it.dis)*n(c.dis)/cant;
  return{material,luz,desgaste,labor,maquina:material+luz+desgaste,total:material+luz+desgaste+labor};
}
function precioReal(it){const k=costoPieza(it),c=C();return Math.max(k.total*(1+n(c.margen)),k.total+n(it.horas)*n(c.gmin))}
function precioAnterior(it){const c=C(),h=n(it.horas);return h*(h<n(c.horaLim)?n(c.hora1):n(c.hora2))}
function precioSugerido(it){return Math.ceil(Math.max(precioReal(it),precioAnterior(it))-0.0001)}
function repartir(monto,k){
  const fixed=k.material+k.luz+k.desgaste,gan=monto-fixed-k.labor,p=Math.min(1,Math.max(0,n(C().pMi)));
  let mi,fondo;if(gan>=0){mi=k.labor+gan*p;fondo=gan*(1-p)}else if(monto-fixed>=0){mi=monto-fixed;fondo=0}else{mi=0;fondo=monto-fixed}
  return{material:r2(k.material),luz:r2(k.luz),desgaste:r2(k.desgaste),fondo:r2(fondo),mi:r2(mi),gan:r2(gan)};
}
function costoVenta(v){
  const m=1+n(C().merma),us=(v.usos||[]).filter(u=>u.fid&&n(u.g)>0);
  const material=us.length?us.reduce((t,u)=>t+n(u.g)*cgOf(u.fid),0)*m:n(v.gramos)*cgDefault()*m;
  return{material,luz:n(v.horas)*luzHora(),desgaste:n(v.horas)*horaMaq(),labor:n(v.labor)};
}
const costoTotal=v=>{const k=costoVenta(v);return k.material+k.luz+k.desgaste};
function repDent(pago,fid){const cp=costoPieza({horas:C().dentHoras,gramos:C().dentGramos,fid,cant:1}),k=n(pago)/(n(C().dent)||1);return repartir(n(pago),{material:cp.material*k,luz:cp.luz*k,desgaste:cp.desgaste*k,labor:0})}

/* ================= Inventario ================= */
function usado(fid){let g=0;live("ventas").forEach(v=>(v.usos||[]).forEach(u=>{if(u.fid===fid)g+=n(u.g)}));live("dentista").forEach(v=>(v.usos||[]).forEach(u=>{if(u.fid===fid)g+=n(u.g)}));live("movs").forEach(m=>{if(m.fid===fid)g+=n(m.g)});return g}
const resta=f=>r2(n(f.gramosIni)-usado(f.id));
const rollos=()=>live("filamentos").filter(f=>!f.archivado).sort((a,b)=>a.color.localeCompare(b.color));
const sw=hex=>`<span class="sw" style="background:${esc(hex||"#ccc")}"></span>`;
function secado(){const l=C().ultimoSecado,d=l?daysBetween(l,today()):null;return{l,d,vence:d===null||d>=n(C().secadoDias)}}

/* ================= Quincenas, luz y apartados ================= */
const qKey=iso=>{const[y,m,d]=iso.split("-");return `${y}-${m}-${+d<=15?1:2}`};
function qInfo(k){const[y,m,h]=k.split("-").map(Number),last=new Date(y,m,0).getDate();return{label:h===1?`1–15 ${MESES[m-1]}`:`16–${last} ${MESES[m-1]}`,fin:`${y}-${String(m).padStart(2,"0")}-${h===1?"15":String(last)}`}}
function miEventos(){
  const ev=[];
  live("ventas").forEach(v=>{if(v.pagado&&v.rep)ev.push({fecha:v.fechaPago||v.fecha,mi:n(v.rep.mi)})});
  live("dentista").forEach(v=>{if(n(v.pago)&&v.rep)ev.push({fecha:v.fecha,mi:n(v.rep.mi)})});
  return ev;
}
function quincenas(){
  const by={};miEventos().forEach(e=>{const k=qKey(e.fecha);by[k]=(by[k]||0)+e.mi});
  const paid={};live("pagos").filter(p=>p.tipo==="quincena").forEach(p=>{paid[p.periodo]=(paid[p.periodo]||0)+n(p.monto)});
  const cur=qKey(today());
  const all=[...new Set([...Object.keys(by),...Object.keys(paid),cur])].sort();
  return all.map(k=>({k,...qInfo(k),total:by[k]||0,pagado:paid[k]||0,pend:(by[k]||0)-(paid[k]||0),actual:k===cur,cerrada:k<cur}));
}
function luzEventos(){
  const ev=[];live("ventas").forEach(v=>{if(n(v.horas))ev.push({fecha:v.fecha,h:n(v.horas)})});
  live("dentista").forEach(v=>{if(n(v.horas))ev.push({fecha:v.fecha,h:n(v.horas)})});
  live("movs").forEach(m=>{if(n(m.horas))ev.push({fecha:m.fecha,h:n(m.horas)})});return ev;
}
function luz(){
  const ev=luzEventos(),h=ev.reduce((t,e)=>t+e.h,0),gen=h*luzHora();
  const pagos=live("pagos").filter(p=>p.tipo==="luz").sort((a,b)=>a.fecha.localeCompare(b.fecha)),pag=pagos.reduce((t,p)=>t+n(p.monto),0);
  const ult=pagos.length?pagos[pagos.length-1].fecha:"",hDesde=ev.filter(e=>!ult||e.fecha>ult).reduce((t,e)=>t+e.h,0);
  return{gen,pag,pend:gen-pag,ult,hDesde,pagos};
}
function apartados(){
  const t={material:0,desgaste:0,fondo:0,mi:0};
  const add=r=>{if(!r)return;t.material+=n(r.material);t.desgaste+=n(r.desgaste);t.fondo+=n(r.fondo);t.mi+=n(r.mi)};
  live("ventas").forEach(v=>{if(v.pagado)add(v.rep)});live("dentista").forEach(v=>{if(n(v.pago))add(v.rep)});
  const g={rep:0,fondo:0,mio:0};live("gastos").forEach(x=>{g[x.saleDe||defSaleDe(x.categoria)]+=n(x.monto)});
  const qPag=live("pagos").filter(p=>p.tipo==="quincena").reduce((s,p)=>s+n(p.monto),0),L=luz();
  const o={reposicion:t.material-g.rep,fondo:n(C().fondoInicial)+t.desgaste+t.fondo-g.fondo,luz:L.pend,mi:t.mi-qPag};
  o.total=o.reposicion+o.fondo+o.luz+o.mi;return o;
}

  <div class="card"><h2>Conexión</h2><p class="small muted" style="margin-bottom:10px">${conn&&conn.url?"Conectado a tu Google Sheet.":"Sin conectar: los datos solo están en este dispositivo."} ${Object.keys(outbox).length?`Faltan ${Object.keys(outbox).length} cambio(s) por subir.`:""}</p>
    <div class="stack"><label class="f">URL del Apps Script<input id="a-url" type="url" value="${esc(conn?conn.url:"")}"></label><label class="f">Clave<input id="a-key" type="password" value="${esc(conn?conn.key:"")}"></label><div class="grid2"><button class="btn" data-act="a-conn">Guardar y sincronizar</button><button class="btn sec" data-act="a-full">Descargar todo de nuevo</button></div></div></div>
  <div class="card"><h2>Dinero</h2><div class="grid2">${cfgIn("fondoInicial","Fondo con el que empezaste")}${cfgIn("pMi","Para ti (% de la ganancia)",{pct:1,hint:"El resto va al fondo"})}</div></div>
  <div class="card"><h2>Precio</h2><p class="small muted" style="margin-bottom:10px">El cotizador usa el más alto entre tu precio por hora y el costo real con ganancia.</p><div class="grid2">${cfgIn("hora1","Precio por hora (piezas cortas)")}${cfgIn("hora2","Precio por hora (piezas largas)")}${cfgIn("horaLim","Pieza larga desde (horas)")}${cfgIn("margen","Ganancia sobre costo (%)",{pct:1})}${cfgIn("gmin","Ganancia mínima por hora")}${cfgIn("min","Pedido mínimo")}${cfgIn("mayMin","Mayoreo desde (piezas)")}${cfgIn("mayPct","Descuento mayoreo (%)",{pct:1})}${cfgIn("dis","Tu hora de diseño")}${cfgIn("post","Tu hora de post-proceso")}</div></div>
  <div class="card"><h2>Costos reales</h2><div class="grid2">${cfgIn("precioKg","Filamento por kg")}${cfgIn("merma","Fallas y merma (%)",{pct:1})}${cfgIn("watts","Consumo impresora (W)")}${cfgIn("kwh","Precio kWh con IVA")}${cfgIn("impresora","Precio impresora")}${cfgIn("vida","Vida útil (horas)")}${cfgIn("mant","Mantenimiento por hora")}</div>
    <p class="small muted" style="margin-top:8px">Una hora de impresora te cuesta ${money(luzHora()+horaMaq())}: ${money(luzHora())} de luz y ${money(horaMaq())} de desgaste.</p></div>
  <div class="card"><h2>Dentista y rollos</h2><div class="grid2">${cfgIn("dent","Precio pieza dental")}${cfgIn("dentHoras","Horas por pieza")}${cfgIn("dentGramos","Gramos por pieza")}${cfgIn("secadoDias","Secar cada (días)")}${cfgIn("stockBajo","Avisar bajo de (g)")}</div></div>
  <div class="card"><h2>Cotizaciones</h2><div class="stack">${cfgIn("negocio","Nombre",{text:1})}${cfgIn("tel","Teléfono",{text:1})}${cfgIn("ig","Instagram",{text:1})}${cfgIn("pie","Mensaje al pie",{text:1})}<label class="f">Aviso de fotos y videos<textarea data-cfg="avisoRedes">${esc(c.avisoRedes)}</textarea></label><div class="grid2">${cfgIn("folioC","Siguiente folio cotización")}${cfgIn("folioT","Siguiente folio ticket")}</div></div></div>
  </div>`},
  after(){document.querySelectorAll("[data-cfg]").forEach(i=>i.addEventListener("change",()=>{const k=i.dataset.cfg;let v=i.type==="number"?n(i.value):i.value;if(i.hasAttribute("data-pct"))v=Math.max(0,v)/100;if(k==="pMi")v=Math.min(1,v);C()[k]=v;saveCfg("Guardado")}))}};
ACT["a-conn"]=()=>{const url=$("a-url").value.trim(),key=$("a-key").value.trim();conn=url?{url,key}:null;store(LS.conn,conn);toast(url?"Conexión guardada":"Desconectado");syncNow()};
ACT["a-full"]=()=>{lastPull=0;store(LS.pull,0);syncNow();toast("Descargando todo del Sheet…")};

/* ================= Archivos: compartir o descargar ================= */
function dataToBlob(url){const[h,b]=url.split(","),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:h.split(":")[1].split(";")[0]})}
function shareFile(blob,name,type){
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Descargado");
}

/* ================= PDFs ================= */
let logoImg=null,logoJpg=null;
(()=>{const i=new Image();i.onload=()=>{logoImg=i;const cv=document.createElement("canvas");cv.width=cv.height=320;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,320,320);x.drawImage(i,0,0,320,320);try{logoJpg=cv.toDataURL("image/jpeg",.92)}catch(e){}};i.src="logo.png"})();
const NAVYc=[19,34,61],BLUEc=[47,104,176],GOLDc=[154,122,34],ORc=[224,140,44],GREYc=[91,103,121];
const PM=x=>"$"+(Math.round(x*100)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const fname=(t,f,c)=>`${t}_${f}_${String(c).replace(/[^\wáéíóúñÁÉÍÓÚÑ -]/g,"").trim().replace(/\s+/g,"_")}.pdf`;
const contacto=()=>{const c=C();return[c.tel&&("Tel. "+c.tel),c.ig&&("IG @"+String(c.ig).replace(/^@/,""))].filter(Boolean).join("   ·   ")};
function pdfCot(d){
  const{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"letter"}),W=215.9,M=18,c=C(),t=docTot(d),disc=n(d.pct)>0.0001;
  const head=()=>{doc.setFillColor(...NAVYc);doc.rect(0,0,W,40,"F");doc.setFillColor(...ORc);doc.rect(0,40,W,1.4,"F");
    if(logoJpg){doc.setFillColor(255,255,255);doc.roundedRect(M,6,28,28,3,3,"F");doc.addImage(logoJpg,"JPEG",M+1,7,26,26)}
    doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text(c.negocio||"3DPRINTECH",M+34,19);doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(contacto()||"Impresión 3D",M+34,26);
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("COTIZACIÓN",W-M,18,{align:"right"});doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(`Folio ${d.folio}`,W-M,25,{align:"right"});doc.text(`Fecha ${dlong(d.fecha)}`,W-M,30.5,{align:"right"})};
  head();let y=54;const need=h=>{if(y+h>250){doc.addPage();head();y=52}};
  doc.setTextColor(...GREYc);doc.setFontSize(9);doc.text("PARA",M,y);doc.setTextColor(...NAVYc);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(d.cliente,M,y+6);y+=16;
  const cols=disc?[M,M+78,M+98,M+124]:[M,M+100,M+124];
  const th=()=>{doc.setFillColor(...BLUEc);doc.rect(M,y,W-2*M,9,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text("Descripción",M+3,y+6);doc.text("Cant.",cols[1]+2,y+6);doc.text("Precio normal",cols[2]+2,y+6);if(disc)doc.text("Con descuento",cols[3]+2,y+6);doc.text("Importe",W-M-3,y+6,{align:"right"});y+=9};
  th();doc.setFont("helvetica","normal");doc.setFontSize(10);
  d.items.forEach((it,k)=>{const L=doc.splitTextToSize(it.desc,(cols[1]-M)-6),h=Math.max(9,L.length*4.6+4.5);if(y+h>250){doc.addPage();head();y=52;th();doc.setFont("helvetica","normal");doc.setFontSize(10)}
    if(k%2){doc.setFillColor(246,248,250);doc.rect(M,y,W-2*M,h,"F")}doc.setTextColor(...NAVYc);doc.text(L,M+3,y+6);doc.text(String(it.cant),cols[1]+2,y+6);doc.text(PM(it.normal),cols[2]+2,y+6);
    const u=it.normal*(1-n(d.pct));if(disc)doc.text(PM(u),cols[3]+2,y+6);doc.text(PM(u*it.cant),W-M-3,y+6,{align:"right"});y+=h});
  doc.setDrawColor(215,221,229);doc.line(M,y,W-M,y);y+=8;need(40);const bx=W-M-74;let ty=y;
  const T=[["Total a precio normal",PM(t.normal)]];if(disc)T.push([`Descuento${t.pz>=n(c.mayMin)?" por mayoreo":""} (${Math.round(n(d.pct)*100)}%)`,"-"+PM(t.desc)]);
  T.forEach(([a,b])=>{doc.setTextColor(...GREYc);doc.setFontSize(9.5);doc.text(a,bx,ty);doc.setTextColor(...NAVYc);doc.text(b,W-M,ty,{align:"right"});ty+=6});
  doc.setFillColor(...NAVYc);doc.roundedRect(bx-3,ty-2,77,13,2,2,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("TOTAL",bx,ty+6.5);doc.text(PM(t.total),W-M,ty+6.5,{align:"right"});doc.setFillColor(...ORc);doc.rect(bx-3,ty+11,77,1.2,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...NAVYc);doc.text("Detalles de impresión",M,y);let ly=y+6;doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(...GREYc);
  d.items.filter(i=>i.horas||i.gramos).forEach(i=>{const f=fil(i.fid),cs=i.multi?(i.usos||[]).map(u=>fil(u.fid)).filter(Boolean).map(x=>x.color).join(", "):"",L=doc.splitTextToSize(`${i.desc}: ${i.horas?(Math.round(i.horas*10)/10)+" h":""}${i.horas&&i.gramos?" · ":""}${i.gramos?Math.round(i.gramos)+" g por pieza":""}${cs?" · Colores: "+cs:f?" · "+f.material+" "+f.color:""}`,bx-M-8);doc.text(L,M,ly);ly+=L.length*4.6+1});
  y=Math.max(ly,ty+18)+6;
  const N=[];if(d.entrega)N.push("Tiempo de entrega: "+d.entrega);if(d.vigencia)N.push(`Vigencia de la cotización: ${d.vigencia} días`);if(d.notas)N.push(d.notas);
  if(N.length){need(12+N.length*6);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...NAVYc);doc.text("Detalles de entrega",M,y);y+=6;doc.setFont("helvetica","normal");doc.setFontSize(10);N.forEach(x=>{const L=doc.splitTextToSize("•  "+x,W-2*M);need(L.length*5);doc.text(L,M,y);y+=L.length*5+1.5})}
  if(d.aviso&&c.avisoRedes){const L=doc.splitTextToSize(c.avisoRedes,W-2*M-10),h=L.length*4.6+10;y+=4;need(h);doc.setFillColor(248,235,217);doc.roundedRect(M,y,W-2*M,h,2,2,"F");doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...NAVYc);doc.text("Fotos y videos",M+5,y+6);doc.setFont("helvetica","normal");doc.setTextColor(...GREYc);doc.text(L,M+5,y+11)}
  const P=doc.getNumberOfPages();for(let p=1;p<=P;p++){doc.setPage(p);doc.setDrawColor(...GOLDc);doc.setLineWidth(.8);doc.line(M,262,W-M,262);doc.setTextColor(...GREYc);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(c.pie||"",W/2,268,{align:"center"});if(contacto())doc.text(contacto(),W/2,273,{align:"center"});if(P>1)doc.text(`${p} / ${P}`,W-M,273,{align:"right"})}
  shareFile(doc.output("blob"),fname("Cotizacion",d.folio,d.cliente),"application/pdf");
}
function pdfTicket(d){
  const{jsPDF}=window.jspdf,c=C(),W=80,M=6,t=docTot(d),disc=n(d.pct)>0.0001,meas=new jsPDF({unit:"mm",format:[W,100]});meas.setFontSize(9);
  const B=d.items.map(i=>meas.splitTextToSize(i.desc,W-2*M)),H=112+B.reduce((h,b)=>h+b.length*4+6,0)+(disc?10:0)+(d.notas?12:0),doc=new jsPDF({unit:"mm",format:[W,H]});let y=8;
  if(logoJpg)doc.addImage(logoJpg,"JPEG",W/2-13,y,26,26);y+=31;doc.setTextColor(...NAVYc);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(c.negocio||"3DPRINTECH",W/2,y,{align:"center"});y+=5;
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...GREYc);if(contacto()){doc.text(contacto(),W/2,y,{align:"center"});y+=5}
  const dash=()=>{doc.setDrawColor(150);doc.setLineDashPattern([1,1],0);doc.line(M,y,W-M,y);doc.setLineDashPattern([],0);y+=5};
  dash();doc.setTextColor(...NAVYc);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text("TICKET DE VENTA",W/2,y,{align:"center"});y+=5;doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(`Folio: ${d.folio}`,M,y);doc.text(dlong(d.fecha),W-M,y,{align:"right"});y+=4.5;doc.text(`Cliente: ${d.cliente}`,M,y);y+=4;dash();doc.setFontSize(9);
  d.items.forEach((i,k)=>{doc.setTextColor(...NAVYc);doc.text(B[k],M,y);y+=B[k].length*4;doc.setTextColor(...GREYc);doc.text(`${i.cant} x ${PM(i.normal)}`,M+2,y);doc.setTextColor(...NAVYc);doc.text(PM(i.cant*i.normal),W-M,y,{align:"right"});y+=6});
  dash();if(disc){doc.text("Subtotal",M,y);doc.text(PM(t.normal),W-M,y,{align:"right"});y+=5;doc.text(`Descuento (${Math.round(n(d.pct)*100)}%)`,M,y);doc.text("-"+PM(t.desc),W-M,y,{align:"right"});y+=5}
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("TOTAL",M,y+1);doc.text(PM(t.total),W-M,y+1,{align:"right"});y+=8;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`${t.pz} pieza(s)`,W-M,y,{align:"right"});y+=5;
  if(d.notas){const L=doc.splitTextToSize(d.notas,W-2*M);doc.setTextColor(...GREYc);doc.text(L,M,y);y+=L.length*4+2}
  dash();doc.setTextColor(...NAVYc);doc.setFontSize(9);doc.text(c.pie||"",W/2,y,{align:"center"});
  shareFile(doc.output("blob"),fname("Ticket",d.folio,d.cliente),"application/pdf");
}

function start(){$("welcome").classList.add("hidden");$("shell").classList.remove("hidden");page=(location.hash||"#inicio").slice(1);if(!PAGES[page])page="inicio";render();syncNow()}
$("btn-sync").addEventListener("click",syncNow);
$("w-go").addEventListener("click",async()=>{
  const url=$("w-url").value.trim(),key=$("w-key").value.trim();if(!url||!key){$("w-msg").textContent="Pon la URL y la clave.";return}
  $("w-msg").textContent="Conectando…";conn={url,key};
  try{const r=await api("ping");if(!r.ok){$("w-msg").textContent=r.error==="clave"?"La clave no coincide con la del Apps Script.":"El Apps Script respondió con error.";return}
    store(LS.conn,conn);lastPull=0;store(LS.pull,0);if(!C()._u)saveCfg();start()}catch(e){$("w-msg").textContent="No se pudo conectar. Revisa la URL (debe terminar en /exec) y tu internet."}});
$("w-local").addEventListener("click",()=>{store(LS.conn,null);conn=null;if(!C()._u)saveCfg();start()});
if(conn||C()._u)start();else $("welcome").classList.remove("hidden");
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__3dp={get state(){return state},quincenas,apartados,luz,go};
})();
